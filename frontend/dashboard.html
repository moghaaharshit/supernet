<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Super Net</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="logo">
            <i data-lucide="message-square"></i> Super Net
        </div>
        <button class="hamburger" id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel" id="sidebar">
            <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="message-square" style="color: var(--primary);"></i> Super Net
            </div>
            <nav style="flex: 1;">
                <a href="dashboard.html" class="nav-item active">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="qr.html" class="nav-item">
                    <i data-lucide="smartphone"></i> WhatsApp
                </a>
                <a href="send.html" class="nav-item">
                    <i data-lucide="send"></i> Send Message
                </a>
                <a href="excel.html" class="nav-item">
                    <i data-lucide="file-spreadsheet"></i> Insert Excel
                </a>
                <a href="rules.html" class="nav-item">
                    <i data-lucide="list"></i> Rules
                </a>
                <a href="analytics.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i> Analytics
                </a>
                <a href="settings.html" class="nav-item">
                    <i data-lucide="settings"></i> Settings
                </a>
            </nav>
            <a href="#" id="logoutBtn" class="nav-item" style="margin-top: auto; color: var(--danger);">
                <i data-lucide="log-out"></i> Logout
            </a>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1>Dashboard</h1>
                    <p>Welcome back! Here's your automation overview.</p>
                </div>
                <div class="user-profile">
                    <div class="user-avatar" id="userInitials">U</div>
                    <div style="display: flex; flex-direction: column;">
                        <span id="userName" style="font-weight: 500;">User</span>
                        <span id="userEmail" style="font-size: 0.8rem; color: var(--text-secondary);">user@example.com</span>
                    </div>
                </div>
            </header>

            <div class="dashboard-grid">
                <div class="stat-card glass-panel">
                    <div class="stat-card-header">
                        <h3 style="margin: 0; color: var(--text-secondary); font-size: 1rem;">WhatsApp Status</h3>
                        <i data-lucide="wifi" style="color: var(--success);"></i>
                    </div>
                    <div class="stat-value" id="waStatus" style="font-size: 1.5rem;">Checking...</div>
                    <p style="margin-top: 1rem; font-size: 0.875rem;"><a href="qr.html" style="color: var(--primary); text-decoration: none;">Manage Connection →</a></p>
                </div>
                
                <div class="stat-card glass-panel">
                    <div class="stat-card-header">
                        <h3 style="margin: 0; color: var(--text-secondary); font-size: 1rem;">Messages Received Today</h3>
                        <i data-lucide="message-circle" style="color: var(--primary);"></i>
                    </div>
                    <div class="stat-value" id="msgReceived">--</div>
                </div>
                
                <div class="stat-card glass-panel">
                    <div class="stat-card-header">
                        <h3 style="margin: 0; color: var(--text-secondary); font-size: 1rem;">Auto Replies Sent</h3>
                        <i data-lucide="send" style="color: var(--secondary);"></i>
                    </div>
                    <div class="stat-value" id="repliesSent">--</div>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module">
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { app } from "./js/firebase-config.js";

        lucide.createIcons();

        // Mobile Menu Toggle
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            hamburgerBtn.classList.toggle('active');
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
            document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
        }

        hamburgerBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        // Close sidebar when clicking a nav item on mobile
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
            });
        });

        const auth = getAuth(app);
        
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = '../index.html';
            } else {
                document.getElementById('userName').textContent = user.displayName || 'User';
                document.getElementById('userEmail').textContent = user.email;
                if(user.displayName) {
                    document.getElementById('userInitials').textContent = user.displayName.charAt(0).toUpperCase();
                }
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            signOut(auth).then(() => {
                window.location.href = '../index.html';
            });
        });

        // Fetch Stats
        async function fetchDashboardStats() {
            try {
                const waRes = await fetch('/api/whatsapp/status');
                const waData = await waRes.json();
                const statusEl = document.getElementById('waStatus');
                statusEl.textContent = waData.status === 'CONNECTED' ? 'Connected' : 'Disconnected';
                statusEl.style.color = waData.status === 'CONNECTED' ? 'var(--success)' : 'var(--danger)';

                const analyticsRes = await fetch('/api/analytics');
                const analyticsData = await analyticsRes.json();
                

                document.getElementById('msgReceived').textContent = analyticsData.totalReceived ?? 0;
                document.getElementById('repliesSent').textContent = analyticsData.totalSent ?? 0;

            } catch (error) {
                console.error("Error fetching stats", error);
                document.getElementById('waStatus').textContent = "Error";
            }
        }

        fetchDashboardStats();
    </script>
<script src="js/voice-assistant.js"></script>
</body>
</html>
