<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Net Rules - WhatsApp SaaS</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .rule-card {
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        @media (max-width: 768px) {
            .header-actions {
                flex-direction: column;
                width: 100%;
            }
            .header-actions .glass-panel {
                width: 100%;
            }
            .header-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="logo">
            <i data-lucide="message-square"></i> Super Net
        </div>
        <button class="hamburger" id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel" id="sidebar">
            <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="message-square" style="color: var(--primary);"></i> Super Net
            </div>
            <nav style="flex: 1;">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="qr.html" class="nav-item">
                    <i data-lucide="smartphone"></i> WhatsApp
                </a>
                <a href="send.html" class="nav-item">
                    <i data-lucide="send"></i> Send Message
                </a>
                <a href="excel.html" class="nav-item">
                    <i data-lucide="file-spreadsheet"></i> Insert Excel
                </a>
                <a href="rules.html" class="nav-item active">
                    <i data-lucide="list"></i> Rules
                </a>
                <a href="analytics.html" class="nav-item">
                    <i data-lucide="bar-chart-2"></i> Analytics
                </a>
                <a href="settings.html" class="nav-item">
                    <i data-lucide="settings"></i> Settings
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header" style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Super Net Rules</h1>
                    <p>Manage keywords and automatic responses.</p>
                </div>
                <div class="header-actions" style="display: flex; align-items: center; gap: 1rem;">
                    <!-- AI Reply Mode Toggle -->
                    <div class="glass-panel" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 1rem; border-radius: 12px;">
                        <i data-lucide="brain" style="color: var(--secondary); width: 20px; height: 20px;"></i>
                        <span style="font-weight: 500; font-size: 0.9rem;">AI Reply Mode</span>
                        <label class="ai-toggle-switch" style="position: relative; display: inline-block; width: 48px; height: 26px;">
                            <input type="checkbox" id="aiModeToggle" style="opacity: 0; width: 0; height: 0;">
                            <span class="ai-toggle-slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: 0.3s; border-radius: 26px; border: 1px solid var(--surface-border);"></span>
                        </label>
                    </div>
                    <button class="btn btn-primary" id="addRuleBtn">
                        <i data-lucide="plus"></i> Add New Rule
                    </button>
                </div>
            </header>
            <div id="aiModeInfo" style="display: none; margin-bottom: 1.5rem; padding: 1rem 1.5rem; background: linear-gradient(135deg, rgba(236, 72, 153, 0.15), rgba(99, 102, 241, 0.15)); border: 1px solid rgba(236, 72, 153, 0.3); border-radius: 12px;">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <i data-lucide="sparkles" style="color: var(--secondary); width: 20px; height: 20px;"></i>
                    <span style="font-weight: 600; color: var(--secondary);">AI Mode Active</span>
                </div>
                <p style="margin-top: 0.5rem; margin-bottom: 0; font-size: 0.875rem;">When no rule matches, AI will generate a smart reply using Gemini AI.</p>
            </div>

            <div id="rulesList" style="flex: 1;">
                <!-- Rules will be injected here -->
                <p style="text-align:center; color: var(--text-secondary); padding: 2rem;">Loading rules...</p>
            </div>
        </main>
    </div>

    <!-- Add Rule Modal -->
    <div class="modal" id="ruleModal">
        <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 2rem; margin: 1rem;">
            <h2 style="margin-bottom: 1.5rem;">Add New Rule</h2>
            <form id="ruleForm">
                <div class="form-group">
                    <label class="form-label">Keyword / Phrase</label>
                    <input type="text" id="rKeyword" class="form-control" required placeholder="e.g., price">
                </div>
                <div class="form-group">
                    <label class="form-label">Match Type</label>
                    <select id="rMatchType" class="form-control">
                        <option value="exact">Exact Match</option>
                        <option value="contains">Contains</option>
                        <option value="startsWith">Starts With</option>
                        <option value="endsWith">Ends With</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Reply Message</label>
                    <textarea id="rReply" class="form-control" rows="4" required placeholder="Type your reply here..."></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Delay (seconds)</label>
                        <input type="number" id="rDelay" class="form-control" value="0" min="0">
                    </div>
                    <div class="form-group" style="flex: 1; display: flex; align-items: flex-end; padding-bottom: 0.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" id="rCaseSensitive"> Case Sensitive
                        </label>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
                    <button type="button" class="btn btn-outline" id="closeModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Rule</button>
                </div>
            </form>
        </div>
    </div>
    
    <script type="module">
        lucide.createIcons();

        // Mobile Menu Toggle
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            hamburgerBtn.classList.toggle('active');
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
            document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
        }

        hamburgerBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        // Close sidebar when clicking a nav item on mobile
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
            });
        });

        const apiUrl = '/api/rules';
        
        const modal = document.getElementById('ruleModal');
        document.getElementById('addRuleBtn').addEventListener('click', () => modal.classList.add('active'));
        document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.remove('active'));

        async function fetchRules() {
            try {
                const res = await fetch(apiUrl);
                const rules = await res.json();
                renderRules(rules);
            } catch (err) {
                console.error(err);
                document.getElementById('rulesList').innerHTML = '<p>Error loading rules.</p>';
            }
        }

        function renderRules(rules) {
            const list = document.getElementById('rulesList');
            if(rules.length === 0) {
                list.innerHTML = `
                <div class="glass-panel" style="padding: 4rem; text-align: center;">
                    <i data-lucide="inbox" style="width: 48px; height: 48px; color: var(--text-secondary); margin-bottom: 1rem;"></i>
                    <h3>No rules yet</h3>
                    <p style="color: var(--text-secondary);">Create your first super net rule to get started.</p>
                </div>`;
                lucide.createIcons();
                return;
            }

            list.innerHTML = rules.map(rule => `
                <div class="rule-card glass-panel">
                    <div style="flex: 1;">
                        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; flex-wrap: wrap;">
                            <h3 style="margin: 0; color: var(--primary);">${rule.keyword}</h3>
                            <span style="font-size: 0.75rem; padding: 0.2rem 0.5rem; background: rgba(255,255,255,0.1); border-radius: 12px;">${rule.matchType}</span>
                            ${!rule.enabled ? '<span style="font-size: 0.75rem; color: var(--danger);">Disabled</span>' : ''}
                        </div>
                        <p style="margin: 0; font-size: 0.9rem; word-break: break-word;">↳ ${rule.reply}</p>
                    </div>
                    <div style="display: flex; gap: 0.5rem; flex-shrink: 0; margin-left: 1rem;">
                        <button class="btn btn-outline" style="padding: 0.5rem;" onclick="toggleRule('${rule.id}', ${rule.enabled})">
                            <i data-lucide="${rule.enabled ? 'toggle-right' : 'toggle-left'}" style="color: ${rule.enabled ? 'var(--success)' : 'var(--text-secondary)'};"></i>
                        </button>
                        <button class="btn btn-outline" style="padding: 0.5rem; color: var(--danger); border-color: var(--danger);" onclick="deleteRule('${rule.id}')">
                            <i data-lucide="trash-2"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        document.getElementById('ruleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newRule = {
                keyword: document.getElementById('rKeyword').value,
                reply: document.getElementById('rReply').value,
                matchType: document.getElementById('rMatchType').value,
                delay: parseInt(document.getElementById('rDelay').value) || 0,
                caseSensitive: document.getElementById('rCaseSensitive').checked,
                enabled: true
            };
            try {
                await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newRule)
                });
                modal.classList.remove('active');
                e.target.reset();
                fetchRules();
            } catch (err) {
                console.error(err);
            }
        });

        window.deleteRule = async (id) => {
            if(confirm('Are you sure you want to delete this rule?')) {
                await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
                fetchRules();
            }
        };

        window.toggleRule = async (id, currentStatus) => {
            await fetch(`${apiUrl}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: !currentStatus })
            });
            fetchRules();
        };

        // AI Mode Toggle
        const aiModeToggle = document.getElementById('aiModeToggle');
        const aiModeInfo = document.getElementById('aiModeInfo');
        
        const aiToggleStyle = document.createElement('style');
        aiToggleStyle.textContent = `
            .ai-toggle-switch .ai-toggle-slider:before {
                position: absolute;
                content: "";
                height: 20px;
                width: 20px;
                left: 3px;
                bottom: 2px;
                background-color: var(--text-primary);
                transition: 0.3s;
                border-radius: 50%;
            }
            .ai-toggle-switch input:checked + .ai-toggle-slider {
                background: linear-gradient(135deg, var(--primary), var(--secondary));
                border-color: transparent;
                box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
            }
            .ai-toggle-switch input:checked + .ai-toggle-slider:before {
                transform: translateX(22px);
            }
        `;
        document.head.appendChild(aiToggleStyle);

        async function fetchAiMode() {
            try {
                const res = await fetch('/api/settings/ai-mode');
                const data = await res.json();
                aiModeToggle.checked = data.aiModeEnabled || false;
                aiModeInfo.style.display = data.aiModeEnabled ? 'block' : 'none';
            } catch (err) {
                console.error('Error fetching AI mode:', err);
            }
        }

        aiModeToggle.addEventListener('change', async () => {
            const enabled = aiModeToggle.checked;
            try {
                await fetch('/api/settings/ai-mode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ aiModeEnabled: enabled })
                });
                aiModeInfo.style.display = enabled ? 'block' : 'none';
            } catch (err) {
                console.error('Error toggling AI mode:', err);
                aiModeToggle.checked = !enabled;
            }
        });

        fetchRules();
        fetchAiMode();
    </script>
<script src="js/voice-assistant.js"></script>
</body>
</html>
